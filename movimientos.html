<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Historial de Movimientos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f6fa;
      margin: 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background-color: #004080; /* barra azul */
    }

    /* Contenedor de enlaces a la izquierda */
    .header-left {
      display: flex;
      gap: 20px;
    }

    .nav-link {
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      text-decoration: none;
      transition: color .25s;
    }
    .nav-link:hover {
      color: #0073e6;
    }

    /* Derecha: usuario y logo */
    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .usuario {
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
    }

    header img {
      height: 50px;
    }

    h2 {
      color: #004080;
      text-align: center;
      margin-top: 20px;
    }

    table {
      width: 80%;
      border-collapse: collapse;
      margin: 20px auto;
      background: #fff;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #004080;
      color: white;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    .entrada {
      color: green;
      font-weight: bold;
    }

    .salida {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <!-- Izquierda: enlaces -->
    <div class="header-left">
      <a href="panel.html" class="nav-link">Panel principal</a>
      <a href="bolsillos.html" class="nav-link">Bolsillos</a>
    </div>

    <!-- Derecha: usuario y logo -->
    <div class="header-right">
      <div class="usuario">Carlos Uribe</div>
      <img src="Logo VIX.jpeg" alt="Logo Banco">
    </div>
  </header>

  <h2>Historial de Movimientos</h2>

  <table>
    <tr>
      <th>Tipo</th>
      <th>Número de Cuenta</th>
      <th>Cantidad</th>
    </tr>
    <tr>
      <td class="entrada">Entrada</td>
      <td>1234567890</td>
      <td>$1,000.00</td>
    </tr>
    <tr>
      <td class="salida">Salida</td>
      <td>0987654321</td>
      <td>$500.00</td>
    </tr>
    <tr>
      <td class="entrada">Entrada</td>
      <td>4567891230</td>
      <td>$200.00</td>
    </tr>
  </table>

</body>
</html>
