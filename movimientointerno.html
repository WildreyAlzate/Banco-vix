<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mover Dinero entre Bolsillos</title>
  <style>
    :root{
      --azul:#004080;
      --azul-cta:#0073e6;
      --azul-cta-hover:#005bb5;
      --bg:#f5f6fa;
      --card:#ffffff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:#1b1b1b;
    }

    /* Header */
    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:14px 24px;
      background:var(--azul);
      color:#fff;
    }
    .header-left{
      display:flex;
      gap:20px;
    }
    .nav-link{
      font-size:16px;
      font-weight:700;
      color:#fff;
      text-decoration:none;
      transition:.25s;
    }
    .nav-link:hover{
      color:var(--azul-cta);
    }
    .header-right{
      display:flex;
      align-items:center;
      gap:15px;
    }
    .usuario{
      font-size:16px;
      font-weight:700;
      color:#fff;
    }
    header img{
      height:48px;
      width:auto;
    }

    /* Main */
    .main{
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:calc(100vh - 70px);
      padding:20px;
    }
    .card{
      background:var(--card);
      border-radius:16px;
      box-shadow:0 6px 18px rgba(0,0,0,.12);
      padding:30px;
      width:100%;
      max-width:420px;
    }
    .card h2{
      margin-top:0;
      color:var(--azul);
      text-align:center;
    }
    label{
      display:block;
      margin-top:14px;
      font-weight:600;
      margin-bottom:6px;
    }
    input, select{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid #ccc;
      font-size:15px;
    }
    .btn{
      margin-top:22px;
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      background:var(--azul-cta);
      color:#fff;
      transition:.25s;
    }
    .btn:hover{ background:var(--azul-cta-hover); }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <!-- Izquierda -->
    <div class="header-left">
      <a href="panel.html" class="nav-link">Panel principal</a>
      <a href="bolsillos.html" class="nav-link">Bolsillos</a>
      <a href="movimientos.html" class="nav-link">Historial</a>
    </div>
    <!-- Derecha -->
    <div class="header-right">
      <div class="usuario">Carlos Uribe</div>
      <img src="Logo VIX.jpeg" alt="Logo Banco VIX">
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="main">
    <div class="card">
      <h2>Mover Dinero entre Bolsillos</h2>
      <form>
        <!-- Bolsillo de origen -->
        <label for="bolsillo-origen">Bolsillo de origen</label>
        <select id="bolsillo-origen" name="bolsillo-origen" required>
          <option value="">Seleccione...</option>
          <option value="ahorros">Ahorros</option>
          <option value="viajes">Viajes</option>
          <option value="emergencias">Emergencias</option>
        </select>

        <!-- Bolsillo de destino -->
        <label for="bolsillo-destino">Bolsillo de destino</label>
        <select id="bolsillo-destino" name="bolsillo-destino" required>
          <option value="">Seleccione...</option>
          <option value="ahorros">Ahorros</option>
          <option value="viajes">Viajes</option>
          <option value="emergencias">Emergencias</option>
        </select>

        <!-- Cantidad -->
        <label for="cantidad">Cantidad a mover (USD)</label>
        <input type="number" id="cantidad" name="cantidad" placeholder="$$$$" required>

        <!-- Contraseña -->
        <label for="password">Contraseña de la cuenta</label>
        <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>

        <!-- Botón -->
        <button type="submit" class="btn">Enviar</button>
      </form>
    </div>
  </main>
</body>
</html>
