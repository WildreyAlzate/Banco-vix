<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Banco VIX - Enviar Dinero</title>
  <style>
    :root{
      --azul:#004080;
      --azul-cta:#0073e6;
      --azul-cta-hover:#005bb5;
      --bg:#f5f7fa;
      --card:#ffffff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:#1b1b1b;
    }

    /* Header */
    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:14px 24px;
      background:var(--azul);
      color:#fff;
    }
    header h1{
      margin:0;
      font-size:22px;
      font-weight:700;
      letter-spacing:.3px;
    }
    .header-right{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .usuario-info{
      font-size:16px;
      font-weight:700;
      white-space:nowrap;
    }
    header img{
      height:48px;
      width:auto;
      display:block;
    }

    /* Formulario central */
    .main{
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:calc(100vh - 80px);
      padding:20px;
    }
    .card{
      background:var(--card);
      border-radius:16px;
      box-shadow:0 6px 18px rgba(0,0,0,.12);
      padding:30px;
      width:100%;
      max-width:420px;
    }
    .card h2{
      margin-top:0;
      color:var(--azul);
      text-align:center;
    }
    label{
      display:block;
      margin-top:14px;
      font-weight:600;
      margin-bottom:6px;
    }
    input, select{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid #ccc;
      font-size:15px;
    }
    .btn{
      margin-top:22px;
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      background:var(--azul-cta);
      color:#fff;
      transition:.25s;
    }
    .btn:hover{ background:var(--azul-cta-hover); }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <!-- Izquierda -->
    <h1>Banco VIX</h1>
    
    <!-- Derecha -->
    <div class="header-right">
      <div class="usuario-info"><span id="nombre-usuario">Carlos Uribe</span></div>
      <img src="Logo VIX.jpeg" alt="Logo Banco VIX">
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="main">
    <div class="card">
      <h2>Enviar Dinero</h2>
      <form>
        <!-- Contraseña -->
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>

        <!-- Tipo de cuenta destino -->
        <label for="tipo-cuenta">Tipo de cuenta destino</label>
        <select id="tipo-cuenta" name="tipo-cuenta" required>
          <option value="">Seleccione...</option>
          <option value="ahorros">Cuenta de ahorros</option>
          <option value="corriente">Cuenta corriente</option>
        </select>

        <!-- Número de cuenta destino -->
        <label for="numero-cuenta">Número de cuenta destino</label>
        <input type="text" id="numero-cuenta" name="numero-cuenta" placeholder="Ej: 1234567890" required>

        <!-- Cantidad de dinero -->
        <label for="cantidad-dinero">Cantidad de dinero (USD)</label>
        <input type="text" id="cantidad-dinero" name="cantidad-dinero" placeholder="$$$$" required>

        <!-- Código de un solo uso -->
        <label for="codigo-uso">Código de un solo uso</label>
        <input 
          type="text" 
          id="codigo-uso" 
          name="codigo-uso" 
          placeholder="Ej: 482913" 
          pattern="[0-9]{6}" 
          maxlength="6" 
          inputmode="numeric" 
          required>

        <!-- Botón -->
        <button type="submit" class="btn">Continuar</button>
      </form>
    </div>
  </main>
</body>
</html>
