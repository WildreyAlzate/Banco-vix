<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Banco VIX - Bolsillos</title>
  <style>
    :root{
      --azul:#004080;
      --azul-cta:#0073e6;
      --azul-cta-hover:#005bb5;
      --verde:#00b894;
      --verde-hover:#008f6f;
      --bg:#f5f7fa;
      --card:#ffffff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:#1b1b1b;
    }

    /* Header */
    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      padding:14px 24px;
      background:var(--azul);
      color:#fff;
    }
    header h1{
      margin:0;
      font-size:20px;
      font-weight:700;
      letter-spacing:.3px;
    }
    .header-left{
      display:flex;
      align-items:center;
      gap:20px;
    }
    .nav-link{
      font-size:16px;
      font-weight:700;
      white-space:nowrap;
      color:#fff;
      text-decoration:none;
      transition:color .25s;
    }
    .nav-link:hover{
      color:var(--azul-cta);
    }
    .header-right{
      display:flex;
      align-items:center;
      gap:16px;
      text-align:right;
    }
    .usuario-info{
      font-size:16px;
      font-weight:700;
      white-space:nowrap;
    }
    header img{
      height:48px;
      width:auto;
      display:block;
      border-radius:6px;
    }

    /* Main */
    .main{
      padding:32px 24px;
      max-width:1000px;
      margin:0 auto;
    }

    /* Card */
    .card{
      background:var(--card);
      border-radius:16px;
      box-shadow:0 6px 18px rgba(0,0,0,.12);
      padding:24px;
      margin-bottom:20px;
    }

    /* Formulario */
    form label{
      display:block;
      margin-top:14px;
      font-weight:600;
      margin-bottom:6px;
    }
    input{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid #ccc;
      font-size:15px;
    }
    .btn{
      margin-top:22px;
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      transition:.25s;
    }
    .btn-crear{
      background:var(--verde);
      color:#fff;
    }
    .btn-crear:hover{ background:var(--verde-hover); }

    /* Lista de bolsillos */
    .bolsillos-lista{
      display:grid;
      gap:16px;
      grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
      margin-top:20px;
    }
    .bolsillo-card{
      border-left:6px solid var(--azul);
    }
    .bolsillo-card h3{
      margin:0 0 6px;
      color:var(--azul);
    }
    .bolsillo-monto{
      font-size:20px;
      font-weight:700;
      color:var(--verde);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-left">
      <h1>Banco VIX</h1>
      <a href="panel.html" class="nav-link">Panel principal</a>
      <a href="movimientos.html" class="nav-link">Historial</a>
    </div>
    <div class="header-right">
      <div class="usuario-info">
        Bienvenido, <span id="nombre-usuario">Carlos Uribe</span>
      </div>
      <img src="Logo VIX.jpeg" alt="Logo Banco VIX"/>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="main">
    <!-- Crear bolsillo -->
    <section class="card">
      <h2>Crear nuevo bolsillo</h2>
      <form id="form-bolsillo">
        <label for="nombre-bolsillo">Nombre del bolsillo</label>
        <input type="text" id="nombre-bolsillo" name="nombre-bolsillo" placeholder="Ej: Viajes, Ahorro extra" required>

        <label for="monto-bolsillo">Monto inicial (USD)</label>
        <input type="number" id="monto-bolsillo" name="monto-bolsillo" placeholder="Ej: 200" min="1" required>

        <button type="submit" class="btn btn-crear">Crear bolsillo</button>
      </form>
    </section>

    <!-- Lista de bolsillos -->
    <section>
      <h2>Mis bolsillos</h2>
      <div id="bolsillos" class="bolsillos-lista"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById("form-bolsillo");
    const lista = document.getElementById("bolsillos");

    form.addEventListener("submit", function(e){
      e.preventDefault();

      const nombre = document.getElementById("nombre-bolsillo").value.trim();
      const monto = document.getElementById("monto-bolsillo").value;

      if(nombre && monto > 0){
        // Crear tarjeta de bolsillo
        const card = document.createElement("div");
        card.classList.add("card","bolsillo-card");

        card.innerHTML = `
          <h3>${nombre}</h3>
          <p class="bolsillo-monto">$${parseFloat(monto).toFixed(2)} USD</p>
        `;

        lista.appendChild(card);

        // Resetear formulario
        form.reset();
      }
    });
  </script>
</body>
</html>
