<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Banco VIX - Panel</title>
  <style>
    :root{
      --azul:#004080;
      --azul-cta:#0073e6;
      --azul-cta-hover:#005bb5;
      --verde:#00b894;
      --verde-hover:#008f6f;
      --bg:#f5f7fa;
      --card:#ffffff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:#1b1b1b;
    }

    /* Header */
    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      padding:14px 24px;
      background:var(--azul);
      color:#fff;
    }
    header h1{
      margin:0;
      font-size:20px;
      font-weight:700;
      letter-spacing:.3px;
    }
    .header-left{
      display:flex;
      align-items:center;
      gap:20px;
    }
    .nav-link{
      font-size:16px;
      font-weight:700;
      white-space:nowrap;
      color:#fff;
      text-decoration:none;
      transition:color .25s;
    }
    .nav-link:hover{
      color:var(--azul-cta);
    }
    .header-right{
      display:flex;
      align-items:center;
      gap:16px;
      text-align:right;
    }
    .usuario-info{
      font-size:16px;
      font-weight:700;
      white-space:nowrap;
    }
    header img{
      height:48px;
      width:auto;
      display:block;
      border-radius:6px;
      background:#fff0;
    }

    /* Layout principal */
    .main{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:24px;
      padding:32px 24px;
      max-width:1100px;
      margin:0 auto;
    }

    /* Card reutilizable */
    .card{
      background:var(--card);
      border-radius:16px;
      box-shadow:0 6px 18px rgba(0,0,0,.12);
      padding:24px;
    }

    /* Transferencias (izquierda) */
    .transferencias{
      width:320px;
    }
    .transferencias h2{
      margin:0 0 14px;
      color:var(--azul);
      font-size:22px;
    }
    .btn{
      display:block;
      width:100%;
      margin:10px 0;
      padding:14px 16px;
      border:none;
      border-radius:10px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      transition:.25s;
    }
    .btn-usuario{
      background:var(--azul-cta);
      color:#fff;
    }
    .btn-usuario:hover{ background:var(--azul-cta-hover); }
    .btn-bolsillo{
      background:var(--verde);
      color:#fff;
    }
    .btn-bolsillo:hover{ background:var(--verde-hover); }

    /* Saldo (derecha) */
    .saldo-panel{
      flex:1;
      display:flex;
      justify-content:flex-end;
    }
    .saldo-card{
      min-width:360px;
      text-align:right;
    }
    .saldo-titulo{
      margin:0 0 8px;
      color:#4a4a4a;
      font-weight:600;
    }
    .saldo-monto{
      font-size:44px;
      font-weight:800;
      color:var(--azul);
      line-height:1.1;
      word-break:break-word;
    }
    .currency-row{
      margin-top:12px;
      display:flex;
      gap:10px;
      justify-content:flex-end;
      align-items:center;
    }
    .currency-row label{
      font-size:14px;
      color:#444;
      font-weight:600;
    }
    .currency-select{
      padding:10px 12px;
      border-radius:10px;
      border:1px solid #cfcfcf;
      font-size:14px;
      background:#fff;
      min-width:260px;
    }

    /* Responsivo */
    @media (max-width: 900px){
      .main{ flex-direction:column; }
      .saldo-panel{ justify-content:stretch; }
      .saldo-card{ text-align:left; min-width:unset; }
      .currency-row{ justify-content:flex-start; }
      .header-left{ flex-direction:column; align-items:flex-start; gap:6px; }
    }
  </style>
</head>
<body>
  <!-- Header con título a la izquierda; enlaces a la izquierda; usuario + logo a la derecha -->
  <header>
    <div class="header-left">
      <h1>Banco VIX</h1>
      <a href="movimientos.html" class="nav-link">Historial</a>
      <a href="bolsillos.html" class="nav-link">Bolsillos</a>
    </div>
    <div class="header-right">
      <div class="usuario-info">
        Bienvenido, <span id="nombre-usuario">Juan Pérez</span>
      </div>
      <img src="Logo VIX.jpeg" alt="Logo Banco VIX"/>
    </div>
  </header>
  

  <!-- Contenido principal -->
  <main class="main">
    <!-- Transferencias (izquierda) -->
    <section class="transferencias card">
      <h2>Transferencias</h2>
      <button class="btn btn-usuario" id="btn-otro-usuario" onclick="window.location.href='transferencia.html'">Transferir a otro usuario</button>
      <button class="btn btn-bolsillo" id="btn-otro-bolsillo" onclick="window.location.href='movimientointerno.html'">Transferir a otro bolsillo </button>
    </section>

    <!-- Saldo (derecha) -->
    <section class="saldo-panel">
      <div class="saldo-card card">
        <p class="saldo-titulo">Saldo total de la cuenta</p>
        <div class="saldo-monto" id="saldo">$12,500.00 USD</div>

        <div class="currency-row">
          <label for="currency">Ver saldo en:</label>
          <select id="currency" class="currency-select" onchange="cambiarMoneda()">
            <option value="USD">Dólares americanos (USD)</option>
            <option value="UYU">Pesos uruguayos (UYU)</option>
            <option value="COP">Pesos colombianos (COP)</option>
            <option value="MXN">Pesos mexicanos (MXN)</option>
            <option value="BRL">Reales brasileros (BRL)</option>
            <option value="CLP">Pesos chilenos (CLP)</option>
            <option value="ARS">Pesos argentinos (ARS)</option>
            <option value="GBP">Libras esterlinas (GBP)</option>
            <option value="CAD">Dólares canadienses (CAD)</option>
            <option value="PEN">Nuevos soles peruanos (PEN)</option>
            <option value="EUR">Euros (EUR)</option>
          </select>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Nombre visible
    document.getElementById("nombre-usuario").textContent = "Carlos Uribe"; 

    // Saldo base en USD (número, sin formato)
    let saldoBaseUSD = 12500;

    // Tasas de cambio simuladas (USD como referencia)
    const tasas = {
      USD:   1,       
      UYU: 1,       
      COP:   4200,
      MXN: 18.66,
      BRL: 5.41,
      CLP: 960.26,
      ARS: 1.356,    
      GBP:   0.78, 
      CAD: 1.39,
      PEN: 3.50,
      EUR: 0.86    
    };

    function formatoNumero(valor){
      return valor.toLocaleString(undefined, {maximumFractionDigits: 2});
    }

    function cambiarMoneda(){
      const currency = document.getElementById("currency").value;
      const saldoEl  = document.getElementById("saldo");

      let convertido = saldoBaseUSD * (tasas[currency] || 1);

      let simbolo = "$";
      if(currency === "GBP") simbolo = "£";
      if(currency === "EUR") simbolo = "€";

      let sufijo = currency;
      saldoEl.textContent = `${simbolo}${formatoNumero(convertido)} ${sufijo}`;
    }

    cambiarMoneda();

   
  </script>
</body>
</html>
