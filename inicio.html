<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Banco Vix</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom right, #004080, #0073e6);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            width: 350px;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #004080;
        }
        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }
        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        .biometric-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .biometric-button {
            flex: 1;
            padding: 10px;
            border: none;
            background-color: #0073e6;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .biometric-button:hover {
            background-color: #005bb5;
        }
        button[type="submit"] {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #004080;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        button[type="submit"]:hover {
            background-color: #003060;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Banco Vix - Inicio de Sesión</h2>
        <form>
            <!-- 1: Selección de tipo de usuario -->
            <label for="tipo-usuario">Tipo de usuario</label>
            <select id="tipo-usuario" name="tipo-usuario" required>
                <option value="">Seleccione...</option>
                <option value="admin">Administrador</option>
                <option value="asistente">Asistente</option>
                <option value="cliente">Cliente</option>
            </select>

            <!-- 2: Nombre de usuario -->
            <label for="usuario">Nombre de usuario</label>
            <input type="text" id="usuario" name="usuario" placeholder="Ingrese su usuario" required>

            <!-- 3: Contraseña -->
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>

            <!-- 4: Verificación biométrica -->
            <label>Verificación biométrica</label>
            <div class="biometric-container">
                <button type="button" class="biometric-button">Huella</button>
                <button type="button" class="biometric-button">FaceID</button>
            </div>

            <!-- Botón de inicio de sesión -->
            <button type="submit">Iniciar Sesión</button>
        </form>
    </div>
</body>
</html>
